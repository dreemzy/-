<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>5.1</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
      margin: 0;
    }
    .progress-container {
      width: 300px;
      height: 50px;
      border: 4px solid #ff9800;
      position: relative;
      overflow: hidden;
      background-color: #fff;
    }
    .progress-bar {
      width: 30%;
      height: 100%;
      background-color: #ff9800;
      position: absolute;
      left: -30%;
      animation: moveProgress 2s linear infinite;
    }
    @keyframes moveProgress {
      0% { left: -30%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="progress-container">
    <div class="progress-bar"></div>
  </div>
</body>
</html>
