<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>5.4</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f5f5f5;
      padding: 50px 20px;
    }
    .pricing-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .price-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      flex: 1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      /* Ровно 1 секунда анимации перехода по условию ТЗ */
      transition: transform 1s ease, box-shadow 1s ease;
      position: relative;
      z-index: 1;
    }
    /* эффект scale() увеличивает визуально, но сохраняет прежнее физическое место в потоке, соседи не сдвигаются */
    .price-card:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .card-header { font-weight: bold; font-size: 14px; color: #666; margin-bottom: 15px; }
    .price { font-size: 36px; font-weight: bold; margin-bottom: 15px; }
    .price span { font-size: 12px; color: #999; font-weight: normal; }
    .features { list-style: none; padding: 0; margin: 0 0 20px 0; font-size: 13px; color: #666; line-height: 2; }

    .buy-btn { width: 100%; padding: 10px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
    .btn-pink { background: #e91e63; }
    .btn-orange { background: #ff9800; }
    .btn-blue { background: #2196f3; }
  </style>
</head>
<body>
  <div class="pricing-grid">
    <div class="price-card">
      <div class="card-header">ENTERPRISE</div>
      <div class="price">$69<span>/per month</span></div>
      <ul class="features">
        <li>10GB disk space</li>
        <li>100GB bandwidth</li>
      </ul>
      <button class="buy-btn btn-pink">BUY</button>
    </div>

    <div class="price-card">
      <div class="card-header">PROFESSIONAL</div>
      <div class="price">$29<span>/per month</span></div>
      <ul class="features">
        <li>5GB disk space</li>
        <li>60GB bandwidth</li>
      </ul>
      <button class="buy-btn btn-orange">BUY</button>
    </div>

    <div class="price-card">
      <div class="card-header">STANDARD</div>
      <div class="price">$19<span>/per month</span></div>
      <ul class="features">
        <li>3GB disk space</li>
        <li>30GB bandwidth</li>
      </ul>
      <button class="buy-btn btn-blue">BUY</button>
    </div>
  </div>
</body>
</html>
