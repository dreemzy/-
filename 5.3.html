<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>5.3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f3f4f6;
      margin: 0;
    }
    .card-form-container {
      width: 100%;
      max-width: 400px;
      padding: 25px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .form-group input:focus {
      border-color: #2563eb;
      outline: none;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #059669; }
  </style>
</head>
<body>
  <div class="card-form-container">
    <form onsubmit="event.preventDefault(); alert('Оплата успешно проведена!');">
      <div class="form-group">
        <label>Номер кредитной карты</label>
        <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required>
      </div>
      <div class="form-group">
        <label>Имя владельца</label>
        <input type="text" placeholder="IVAN IVANOV" required style="text-transform: uppercase;">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Срок действия</label>
          <input type="text" placeholder="MM/YY" maxlength="5" required>
        </div>
        <div class="form-group">
          <label>CVV / CV<input type="password" placeholder="***" maxlength="3" required>
        </div>
      </div>
      <button type="submit" class="pay-btn">Оплатить</button>
    </form>
  </div>
</body>
</html>
